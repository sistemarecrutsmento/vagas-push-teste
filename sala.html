<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VagasIO — criar sala de teste</title><style>body{font:16px system-ui;max-width:620px;margin:30px auto;padding:20px;color:#222}input,button{display:block;width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #bbb}button{background:#722f37;color:#fff;font-weight:700;border:0}#status{padding:12px;background:#f5f5f5;border-radius:8px;white-space:pre-wrap}#links{display:none;background:#f5f5f5;padding:15px;border-radius:8px;word-break:break-all}a{color:#722f37}</style><h1>Criar entrevista de teste</h1><p>Ambiente isolado — não usa dados do VagasIO oficial. A sala expira automaticamente.</p><input id="vaga" placeholder="Vaga/candidatura (obrigatório)"><input id="cand" placeholder="Nome do candidato"><input id="recr" placeholder="Nome do recrutador"><button id="criar">Criar sala</button><div id="status" role="status">Aguardando.</div><div id="links"><b>Sala criada</b><p>Recrutador:<br><a id="lr"></a></p><p>Candidato:<br><a id="lc"></a></p></div><script>const API='https://vagas-push-teste.onrender.com',BASE='https://sistemarecrutsmento.github.io/vagas-push-teste/video.html',q=id=>document.getElementById(id),set=t=>q('status').textContent=t;q('criar').onclick=async()=>{const b={vaga:q('vaga').value,candidato:q('cand').value,recrutador:q('recr').value};if(!b.vaga.trim())return set('Informe a vaga/candidatura.');const btn=q('criar');btn.disabled=true;set('Criando sala…');const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),10000);try{const r=await fetch(API+'/create-room',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b),signal:ctl.signal});let j;try{j=await r.json()}catch{throw Error('resposta inválida do servidor')}if(!r.ok)throw Error(j.error||'não foi possível criar a sala');for(const [id,u] of [['lr',j.recrutador_url],['lc',j.candidato_url]]){q(id).href=u;q(id).textContent=u}q('links').style.display='block';set('Sala criada. Cada link contém um token de função separado e expira em '+j.ttlSeconds+' segundos.');}catch(e){set(e.name==='AbortError'?'Tempo esgotado — tente novamente.':'Falha: '+e.message)}finally{clearTimeout(timer);btn.disabled=false}};</script></html>
