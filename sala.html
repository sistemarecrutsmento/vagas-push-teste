<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar entrevista — VagasIO</title><style>body{font-family:Arial;max-width:620px;margin:30px auto;padding:20px}input,button{display:block;width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccc}button{background:#722f37;color:white;font-weight:bold;border:0}#links{display:none;background:#f5f5f5;padding:15px;border-radius:8px;word-break:break-all}a{color:#722f37}</style><h1>Criar entrevista de teste</h1><p>Ambiente separado do VagasIO oficial.</p><input id="vaga" placeholder="Nome da vaga/candidatura"><input id="cand" placeholder="Nome do candidato"><input id="recr" placeholder="Nome do recrutador"><button id="criar">Criar sala</button><div id="status"></div><div id="links"><b>Sala criada</b><p>Link do recrutador:<br><a id="lr"></a></p><p>Link do candidato:<br><a id="lc"></a></p><p>Histórico da entrevista:<br><a id="lh"></a></p></div><script>const API='https://vagas-push-teste.onrender.com';const BASE='https://sistemarecrutsmento.github.io/vagas-push-teste/video.html';$('criar').onclick=async()=>{const r=await fetch(API+'/create-room',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({vaga:$('vaga').value,candidato:$('cand').value,recrutador:$('recr').value})});const j=await r.json();if(!r.ok)return $('status').textContent=j.erro||'Não foi possível criar a sala';$('status').textContent='Sala criada com sucesso. O convite expira em 15 minutos.';for(const [id,url] of [['lr',j.recrutador_url],['lc',j.candidato_url]]){$(id).href=url;$(id).textContent=url}const hu='https://sistemarecrutsmento.github.io/vagas-push-teste/historico.html?room='+encodeURIComponent(j.room)+'&token='+encodeURIComponent(j.token||new URL(j.recrutador_url).searchParams.get('token'));$('lh').href=hu;$('lh').textContent=hu;$('links').style.display='block'};function $(id){return document.getElementById(id)}</script></html>
