<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste de notificações VagasIO</title><style>body{font-family:Arial;max-width:520px;margin:40px auto;padding:20px;color:#222}button{padding:14px 18px;margin:8px 0;border:0;border-radius:8px;background:#b8860b;color:#fff;font-weight:700}#status{padding:12px;background:#f4f4f4;border-radius:8px;white-space:pre-wrap}</style><h1>Teste de notificações</h1><p>Ambiente separado do VagasIO oficial.</p><button id="ativar">Ativar notificações reais</button><button id="enviar" disabled>Enviar teste pelo backend</button><div id="status">Aguardando teste.</div><script>
const API='https://vagas-push-teste.onrender.com';const s=document.querySelector('#status');let reg;
function b64(s){const p='='.repeat((4-s.length%4)%4),raw=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)))}
document.querySelector('#ativar').onclick=async()=>{try{if(!('Notification'in window)||!('serviceWorker'in navigator)||!('PushManager'in window))throw Error('Navegador sem suporte a Web Push');const p=await Notification.requestPermission();if(p!=='granted')throw Error('Permissão não concedida: '+p);reg=await navigator.serviceWorker.register('./sw.js');await navigator.serviceWorker.ready;const {publicKey}=await fetch(API+'/public-key').then(r=>r.json());if(!publicKey)throw Error('Chave pública indisponível');const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(publicKey)});const r=await fetch(API+'/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(sub)});if(!r.ok)throw Error('Falha ao cadastrar dispositivo');document.querySelector('#enviar').disabled=false;s.textContent='Celular cadastrado. Agora toque em Enviar teste pelo backend.'}catch(e){s.textContent=e.message}}
document.querySelector('#enviar').onclick=async()=>{const r=await fetch(API+'/send-test',{method:'POST'});const j=await r.json();s.textContent=r.ok?'Envio solicitado. Enviados: '+j.enviados:('Falha: '+(j.erro||r.status))};
</script></html>
