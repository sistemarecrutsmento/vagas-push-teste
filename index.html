<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste de notificações VagasIO</title><style>body{font-family:Arial;max-width:520px;margin:40px auto;padding:20px;color:#222}button{padding:14px 18px;margin:8px 0;border:0;border-radius:8px;background:#b8860b;color:#fff;font-weight:700}#status{padding:12px;background:#f4f4f4;border-radius:8px;white-space:pre-wrap}</style><h1>Teste de notificações</h1><p>Ambiente separado. Esta página apenas testa a autorização e a exibição de notificações no seu dispositivo.</p><button id="ativar">Ativar e testar notificação</button><div id="status">Aguardando teste.</div><script>const s=document.querySelector('#status');document.querySelector('#ativar').onclick=async()=>{try{if(!('Notification'in window)){s.textContent='Este navegador não suporta notificações.';return}const p=await Notification.requestPermission();if(p!=='granted'){s.textContent='Permissão não concedida: '+p;return}if('serviceWorker'in navigator){await navigator.serviceWorker.register('./sw.js');const r=await navigator.serviceWorker.ready;r.active.postMessage({type:'TEST_NOTIFICATION'});s.textContent='Permissão concedida. Notificação de teste enviada ao navegador.'}else{new Notification('VagasIO — teste',{body:'A notificação está funcionando neste dispositivo.'});s.textContent='Notificação criada.'}}catch(e){s.textContent='Falha no teste: '+e.message}}</script></html>
