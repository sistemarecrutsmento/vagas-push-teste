<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrevista de teste — VagasIO</title><style>body{font-family:Arial;max-width:900px;margin:auto;padding:20px;color:#222}h1{color:#722f37}input,button,select{padding:12px;border-radius:8px;border:1px solid #ccc;margin:4px}button{background:#722f37;color:#fff;border:0;font-weight:bold;cursor:pointer}button:disabled{opacity:.45}.videos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}video{width:100%;background:#111;border-radius:10px;min-height:220px}#status{margin:14px 0;padding:12px;background:#f5f5f5;border-radius:8px}@media(max-width:650px){.videos{grid-template-columns:1fr}video{min-height:180px}}</style><h1>Entrevista por vídeo — teste VagasIO</h1><p>Ambiente isolado do portal oficial. O convite é vinculado à sala, perfil e validade.</p><label>Nome <input id="nome" autocomplete="name"></label><label>Perfil <select id="perfil"><option value="candidato">Candidato</option><option value="recrutador">Recrutador</option></select></label><label>Sala <input id="room" autocomplete="off"></label><button id="entrar">Entrar na sala</button><button id="sair" disabled>Sair</button><button id="encerrar" disabled>Encerrar chamada</button><button id="cam" disabled>Câmera</button><button id="mic" disabled>Microfone</button><div id="status">Aguardando entrada na sala.</div><div class="videos"><div><b>Você</b><video id="local" autoplay muted playsinline></video></div><div><b id="peer-label">Participante</b><video id="remote" autoplay playsinline></video></div></div><section style="margin-top:18px"><b>Chat</b><div id="chat" style="height:120px;overflow:auto;background:#f5f5f5;padding:8px;border-radius:8px;margin:8px 0"></div><input id="msg" placeholder="Digite uma mensagem" style="width:65%"><button id="enviarMsg" disabled>Enviar</button></section><script>
const $=id=>document.getElementById(id),status=t=>$('status').textContent=t;const SIGNAL='wss://vagas-push-teste.onrender.com';const qp=new URLSearchParams(location.search);if(qp.get('room'))$('room').value=qp.get('room');if(qp.get('nome'))$('nome').value=qp.get('nome');const role=(qp.get('role')||'').toLowerCase()==='recrutador'?'recrutador':'candidato';$('perfil').value=role;$('perfil').disabled=!!qp.get('role');const token=qp.get('token')||'';let ws,pc,local,joined=false,ending=false;let camOn=true,micOn=true;
function addChat(text,me=false){const d=document.createElement('div');d.textContent=(me?'Você: ':'Participante: ')+String(text).slice(0,1000);$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight}
function controls(on){$('sair').disabled=!on;$('cam').disabled=!on;$('mic').disabled=!on;$('enviarMsg').disabled=!on;$('encerrar').disabled=!on||role!=='recrutador';$('entrar').disabled=on}
function resetMedia(){if(pc){pc.onicecandidate=null;pc.close();pc=null}if(local)local.getTracks().forEach(t=>t.stop());local=null;$('local').srcObject=null;$('remote').srcObject=null;joined=false;controls(false)}
async function entrar(){const room=$('room').value.trim();const meuNome=$('nome').value.trim()||'Participante';if(!room)return status('Informe um código de sala.');if(!token)return status('Use um link de convite com token válido.');ending=false;try{local=await navigator.mediaDevices.getUserMedia({video:true,audio:true});$('local').srcObject=local;pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});local.getTracks().forEach(t=>pc.addTrack(t,local));pc.ontrack=e=>$('remote').srcObject=e.streams[0];ws=new WebSocket(SIGNAL);ws.onopen=()=>ws.send(JSON.stringify({type:'join',room,token,nome:meuNome,role}));ws.onmessage=async e=>{const m=JSON.parse(e.data);if(m.type==='joined'){joined=true;controls(true);status('Conectado. Aguardando o outro participante…')}if(m.type==='waiting')status('Conectado. Aguardando o outro participante…');if(m.type==='ready'){status('Participante encontrado. Conectando…');const offer=await pc.createOffer();await pc.setLocalDescription(offer);if(ws.readyState===1)ws.send(JSON.stringify({type:'offer',offer}))}if(m.type==='offer'){await pc.setRemoteDescription(m.offer);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);ws.send(JSON.stringify({type:'answer',answer}))}if(m.type==='answer')await pc.setRemoteDescription(m.answer);if(m.type==='candidate')try{await pc.addIceCandidate(m.candidate)}catch(_){}if(m.type==='peer-info'){$('peer-label').textContent=m.nome+' ('+m.perfil+')'}if(m.type==='peer-left')status('O participante saiu. Você pode reconectar com este mesmo convite.');if(m.type==='chat')addChat(m.text);if(m.type==='call-ended'){ending=true;status('A chamada foi encerrada pelo recrutador.');resetMedia();}if(m.type==='expired'){status('Este convite expirou.');resetMedia()}if(['unauthorized','full','ended','expired'].includes(m.type)){status(m.type==='full'?'Esta função já está conectada ou a sala está cheia.':m.type==='ended'?'A chamada foi encerrada.':'Convite inválido ou expirado.');if(ws)ws.close();resetMedia()}};ws.onclose=()=>{if(!ending&&joined){status('Conexão perdida. Você pode entrar novamente com este mesmo convite.');resetMedia()}};pc.onicecandidate=e=>{if(e.candidate&&ws?.readyState===1)ws.send(JSON.stringify({type:'candidate',candidate:e.candidate}))};controls(false)}catch(e){resetMedia();status('Não foi possível acessar câmera/microfone: '+e.message)}}
function sair(){ending=true;if(ws?.readyState===1)ws.close();resetMedia();status('Você saiu da sala. O convite continua válido para reconexão.')}
function encerrar(){if(role!=='recrutador'||!ws||ws.readyState!==1)return;if(confirm('Encerrar a chamada para todos?')){ending=true;ws.send(JSON.stringify({type:'end-call'}));status('Encerrando chamada…')}}
$('entrar').onclick=entrar;$('sair').onclick=sair;$('encerrar').onclick=encerrar;$('cam').onclick=()=>{camOn=!camOn;local?.getVideoTracks().forEach(t=>t.enabled=camOn);$('cam').textContent=camOn?'Câmera':'Câmera desligada'};$('mic').onclick=()=>{micOn=!micOn;local?.getAudioTracks().forEach(t=>t.enabled=micOn);$('mic').textContent=micOn?'Microfone':'Microfone desligado'};$('enviarMsg').onclick=()=>{const text=$('msg').value.trim();if(!text||ws?.readyState!==1)return;ws.send(JSON.stringify({type:'chat',text}));addChat(text,true);$('msg').value=''};$('msg').onkeydown=e=>{if(e.key==='Enter')$('enviarMsg').click()};if(role!=='recrutador')$('encerrar').style.display='none';
</script></html>
