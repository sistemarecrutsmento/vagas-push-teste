<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrevista de teste — VagasIO</title><style>body{font-family:Arial;max-width:900px;margin:auto;padding:20px;color:#222}h1{color:#722f37}input,button,select{padding:12px;border-radius:8px;border:1px solid #ccc;margin:4px}button{background:#722f37;color:#fff;border:0;font-weight:bold;cursor:pointer}button:disabled{opacity:.45}.videos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}video{width:100%;background:#111;border-radius:10px;min-height:220px}#status{margin:14px 0;padding:12px;background:#f5f5f5;border-radius:8px}@media(max-width:650px){.videos{grid-template-columns:1fr}video{min-height:180px}}</style><h1>Entrevista por vídeo — teste VagasIO</h1><p>Ambiente isolado do portal oficial. O convite é vinculado à sala, perfil e validade.</p><label>Nome <input id="nome" autocomplete="name"></label><label>Perfil <select id="perfil"><option value="candidato">Candidato</option><option value="recrutador">Recrutador</option></select></label><label>Sala <input id="room" autocomplete="off"></label><button id="entrar">Entrar na sala</button><button id="sair" disabled>Sair</button><button id="encerrar" disabled>Encerrar chamada</button><button id="cam" disabled>Câmera</button><button id="mic" disabled>Microfone</button><div id="status">Aguardando entrada na sala.</div><div class="videos"><div><b>Você</b><video id="local" autoplay muted playsinline></video></div><div><b id="peer-label">Participante</b><video id="remote" autoplay playsinline></video></div></div><section style="margin-top:18px"><b>Chat</b><div id="chat" style="height:120px;overflow:auto;background:#f5f5f5;padding:8px;border-radius:8px;margin:8px 0"></div><input id="msg" placeholder="Digite uma mensagem" style="width:65%"><button id="enviarMsg" disabled>Enviar</button></section><script>
const $=id=>document.getElementById(id),status=t=>{$('status').textContent=t;console.log('[video]',t)},diag=t=>{$('status').textContent=t+' | diagnóstico: '+new Date().toLocaleTimeString();console.log('[video]',t)};
const SIGNAL='wss://vagas-push-teste.onrender.com';const qp=new URLSearchParams(location.search);const role=(qp.get('role')||'').toLowerCase()==='recrutador'?'recrutador':'candidato';const token=qp.get('token')||'';if(qp.get('room'))$('room').value=qp.get('room');if(qp.get('nome'))$('nome').value=qp.get('nome');$('perfil').value=role;$('perfil').disabled=!!qp.get('role');let ws,pc,local,joined=false,ending=false,remoteDescription=false,queue=[];let camOn=true,micOn=true;
function addChat(t,me=false){const d=document.createElement('div');d.textContent=(me?'Você: ':'Participante: ')+String(t).slice(0,1000);$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight}
function controls(on){$('sair').disabled=!on;$('cam').disabled=!on;$('mic').disabled=!on;$('enviarMsg').disabled=!on;$('encerrar').disabled=!on||role!=='recrutador';$('entrar').disabled=on}
function clean(){if(pc){pc.onicecandidate=null;pc.close();pc=null}if(local)local.getTracks().forEach(t=>t.stop());local=null;$('local').srcObject=null;$('remote').srcObject=null;joined=false;remoteDescription=false;queue=[];controls(false)}
function send(m){if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify(m));else diag('Sinalização indisponível')}
async function setRemote(desc){await pc.setRemoteDescription(desc);remoteDescription=true;for(const c of queue)try{await pc.addIceCandidate(c)}catch(e){diag('ICE pendente rejeitado: '+e.message)}queue=[]}
async function entrar(){const room=$('room').value.trim(),name=$('nome').value.trim()||'Participante';if(!room)return status('Informe um código de sala.');if(!token)return status('Convite sem token válido.');ending=false;try{local=await navigator.mediaDevices.getUserMedia({video:true,audio:true});$('local').srcObject=local;pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});local.getTracks().forEach(t=>pc.addTrack(t,local));pc.ontrack=e=>{$('remote').srcObject=e.streams[0];diag('Mídia remota recebida')};pc.onicecandidate=e=>{if(e.candidate)send({type:'candidate',candidate:e.candidate})};pc.oniceconnectionstatechange=()=>diag('ICE: '+pc.iceConnectionState);pc.onconnectionstatechange=()=>diag('Conexão: '+pc.connectionState);ws=new WebSocket(SIGNAL);ws.onopen=()=>send({type:'join',room,token,nome:name,role});ws.onerror=()=>status('Erro na conexão de sinalização.');ws.onclose=()=>{if(!ending&&joined){status('Sinalização desconectada. Entre novamente para reconectar.');clean()}};ws.onmessage=async e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}try{if(m.type==='joined'){joined=true;controls(true);status('Conectado. Aguardando o outro participante…')}else if(m.type==='waiting')status('Sala conectada; aguardando participante…');else if(m.type==='ready'&&role==='recrutador'){diag('Participante encontrado; recrutador criando oferta');const offer=await pc.createOffer();await pc.setLocalDescription(offer);send({type:'offer',offer})}else if(m.type==='offer'){diag('Oferta recebida; criando resposta');await setRemote(m.offer);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);send({type:'answer',answer})}else if(m.type==='answer'){await setRemote(m.answer);diag('Resposta recebida; negociação concluída')}else if(m.type==='candidate'){const c=new RTCIceCandidate(m.candidate);if(remoteDescription)await pc.addIceCandidate(c);else queue.push(c)}else if(m.type==='peer-info')$('peer-label').textContent=(m.nome||'Participante')+' ('+(m.perfil||'')+')';else if(m.type==='peer-left')status('Participante saiu. Você pode entrar novamente com este convite.');else if(m.type==='chat')addChat(m.text);else if(m.type==='call-ended'){ending=true;status('A chamada foi encerrada pelo recrutador.');clean()}else if(m.type==='expired'){ending=true;status('Este convite expirou.');clean()}else if(['unauthorized','full','ended'].includes(m.type)){ending=true;status(m.reason||'Convite inválido ou sala indisponível.');if(ws)ws.close();clean()}else if(m.type==='error')status('Erro de sinalização: '+m.code)}catch(err){console.error(err);status('Falha na negociação WebRTC: '+err.message)}};controls(false)}catch(e){clean();status('Câmera/microfone indisponível: '+e.message)}}
function sair(){ending=true;if(ws)ws.close();clean();status('Você saiu. O convite continua válido para reconexão.')}function encerrar(){if(role==='recrutador'&&confirm('Encerrar a chamada para todos?')){ending=true;send({type:'end-call'});status('Encerrando chamada…')}}
$('entrar').onclick=entrar;$('sair').onclick=sair;$('encerrar').onclick=encerrar;$('cam').onclick=()=>{camOn=!camOn;local?.getVideoTracks().forEach(t=>t.enabled=camOn);$('cam').textContent=camOn?'Câmera':'Câmera desligada'};$('mic').onclick=()=>{micOn=!micOn;local?.getAudioTracks().forEach(t=>t.enabled=micOn);$('mic').textContent=micOn?'Microfone':'Microfone desligado'};$('enviarMsg').onclick=()=>{const text=$('msg').value.trim();if(text){send({type:'chat',text});addChat(text,true);$('msg').value=''}};$('msg').onkeydown=e=>{if(e.key==='Enter')$('enviarMsg').click()};if(role!=='recrutador')$('encerrar').style.display='none';
</script></html>
