<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrevista de teste — VagasIO</title><style>body{font-family:Arial;max-width:900px;margin:auto;padding:20px;color:#222}h1{color:#722f37}input,button{padding:12px;border-radius:8px;border:1px solid #ccc;margin:4px}button{background:#722f37;color:#fff;border:0;font-weight:bold;cursor:pointer}.videos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}video{width:100%;background:#111;border-radius:10px;min-height:220px}#status{margin:14px 0;padding:12px;background:#f5f5f5;border-radius:8px}@media(max-width:650px){.videos{grid-template-columns:1fr}video{min-height:180px}}</style><h1>Entrevista por vídeo — teste VagasIO</h1><p>Ambiente separado do portal oficial. Abra este link em dois dispositivos ou abas e use o mesmo código de sala.</p><label>Sala <input id="room" placeholder="ex.: entrevista-001" autocomplete="off"></label><button id="entrar">Entrar na sala</button><button id="sair" disabled>Sair</button><div id="status">Aguardando entrada na sala.</div><div class="videos"><div><b>Você</b><video id="local" autoplay muted playsinline></video></div><div><b>Participante</b><video id="remote" autoplay playsinline></video></div></div><script>
const SIGNAL='wss://vagas-push-teste.onrender.com';let ws,pc,local;const $=id=>document.getElementById(id),status=t=>$('status').textContent=t;
async function entrar(){const room=$('room').value.trim();if(!room)return status('Informe um código de sala.');try{local=await navigator.mediaDevices.getUserMedia({video:true,audio:true});$('local').srcObject=local;pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});local.getTracks().forEach(t=>pc.addTrack(t,local));pc.ontrack=e=>$('remote').srcObject=e.streams[0];pc.onicecandidate=e=>e.candidate&&ws.send(JSON.stringify({type:'candidate',candidate:e.candidate}));ws=new WebSocket(SIGNAL);ws.onopen=()=>{ws.send(JSON.stringify({type:'join',room}));status('Conectado. Aguardando o outro participante…');};ws.onmessage=async e=>{const m=JSON.parse(e.data);if(m.type==='ready'){status('Participante encontrado. Conectando…');const offer=await pc.createOffer();await pc.setLocalDescription(offer);ws.send(JSON.stringify({type:'offer',offer}));}if(m.type==='offer'){await pc.setRemoteDescription(m.offer);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);ws.send(JSON.stringify({type:'answer',answer}));}if(m.type==='answer')await pc.setRemoteDescription(m.answer);if(m.type==='candidate')try{await pc.addIceCandidate(m.candidate)}catch(_){}};ws.onclose=()=>status('Sala desconectada.');$('entrar').disabled=true;$('sair').disabled=false;}catch(e){status('Não foi possível acessar câmera/microfone: '+e.message)}}
function sair(){if(ws)ws.close();if(pc)pc.close();if(local)local.getTracks().forEach(t=>t.stop());$('local').srcObject=null;$('remote').srcObject=null;$('entrar').disabled=false;$('sair').disabled=true;status('Você saiu da sala.')}$('entrar').onclick=entrar;$('sair').onclick=sair;
</script></html>
