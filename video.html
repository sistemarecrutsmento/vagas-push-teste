<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VagasIO — entrevista de teste</title><style>body{font:16px system-ui;max-width:980px;margin:auto;padding:18px;color:#222}h1{color:#722f37}input,button,select{padding:10px;border-radius:8px;border:1px solid #bbb;margin:4px}button{background:#722f37;color:white;border:0;font-weight:700}.videos{display:grid;grid-template-columns:1fr 1fr;gap:12px}video{width:100%;background:#111;border-radius:10px;min-height:220px}#status,#diag{padding:10px;background:#f5f5f5;border-radius:8px;white-space:pre-wrap}#chat{height:120px;overflow:auto;background:#f5f5f5;padding:8px}@media(max-width:650px){.videos{grid-template-columns:1fr}}</style><h1>Entrevista por vídeo — teste isolado</h1><p>Use os dois links da tela de criação, em dois dispositivos/abas. Câmera e microfone exigem permissão.</p><div><label>Nome <input id="nome" autocomplete="name"></label><label>Função <select id="role"><option value="candidato">Candidato</option><option value="recrutador">Recrutador</option></select></label><input id="room" placeholder="Sala" readonly><button id="join">Entrar</button><button id="leave" disabled>Sair</button><button id="cam" disabled>Câmera</button><button id="mic" disabled>Microfone</button></div><div id="status">Aguardando entrada.</div><div id="diag">Diagnóstico: ainda não conectado.</div><div class="videos"><div><b>Você</b><video id="local" autoplay muted playsinline></video></div><div><b id="peer">Participante</b><video id="remote" autoplay playsinline></video></div></div><h3>Chat</h3><div id="chat"></div><input id="msg" placeholder="Mensagem" maxlength="2000"><button id="send" disabled>Enviar</button><script>const $=id=>document.getElementById(id),p=new URLSearchParams(location.search),room=p.get('room')||'',token=p.get('token')||'',role=p.get('role')||'';const SIGNAL='wss://vagas-push-teste.onrender.com';$('room').value=room;$('role').value=role;$('nome').value=p.get('nome')||'';let ws,pc,local,queue=[],joined=false,offerer=false,camOn=true,micOn=true;const status=t=>$('status').textContent=t,diag=t=>$('diag').textContent='Diagnóstico: '+t;function chat(t,me){const d=document.createElement('div');d.textContent=(me?'Você: ':'Participante: ')+t;$('chat').append(d)}function send(m){if(ws?.readyState===1)ws.send(JSON.stringify(m))}async function start(){if(!room||!token||!['candidato','recrutador'].includes(role))return status('Link inválido: sala, token ou função ausente. Gere novos links.');$('join').disabled=true;status('Solicitando câmera e microfone…');try{local=await navigator.mediaDevices.getUserMedia({video:true,audio:true});$('local').srcObject=local}catch(e){$('join').disabled=false;return status('Permissão de câmera/microfone recusada ou indisponível: '+e.name+'. Libere o acesso no navegador e tente novamente.')}pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});local.getTracks().forEach(t=>pc.addTrack(t,local));pc.ontrack=e=>{$('remote').srcObject=e.streams[0];diag('mídia remota recebida; conexão '+pc.connectionState)};pc.onicecandidate=e=>e.candidate&&send({type:'candidate',candidate:e.candidate});pc.oniceconnectionstatechange=()=>diag('ICE: '+pc.iceConnectionState+' | conexão: '+pc.connectionState);pc.onconnectionstatechange=()=>{diag('ICE: '+pc.iceConnectionState+' | conexão: '+pc.connectionState);if(pc.connectionState==='failed')status('Conexão de mídia falhou. Rede pode exigir TURN; este teste usa STUN público.')};ws=new WebSocket(SIGNAL);const timeout=setTimeout(()=>{if(!joined){status('Tempo esgotado ao conectar à sinalização.');ws.close()}},12000);ws.onopen=()=>{clearTimeout(timeout);send({type:'join',room,token,role,nome:$('nome').value||'Participante'});status('Conectado à sinalização. Aguardando o outro participante…')};ws.onmessage=async e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='waiting'){status('Sala conectada. Aguardando o outro participante…');joined=true}if(m.type==='ready'){joined=true;offerer=!!m.offerer;status(offerer?'Participante encontrado. Criando oferta…':'Participante encontrado. Aguardando oferta…');if(offerer){const o=await pc.createOffer();await pc.setLocalDescription(o);send({type:'offer',offer:o})}}if(m.type==='peer-info')$('peer').textContent=(m.nome||'Participante')+' ('+(m.role||'')+')';if(m.type==='offer'){await pc.setRemoteDescription(m.offer);for(const c of queue)await pc.addIceCandidate(c);queue=[];const a=await pc.createAnswer();await pc.setLocalDescription(a);send({type:'answer',answer:a})}if(m.type==='answer'){await pc.setRemoteDescription(m.answer);for(const c of queue)await pc.addIceCandidate(c);queue=[]}if(m.type==='candidate'){const c=new RTCIceCandidate(m.candidate);if(pc.remoteDescription)await pc.addIceCandidate(c);else queue.push(c)}if(m.type==='chat')chat(m.text,false);if(m.type==='error'){status('Sinalização recusou a entrada: '+m.code);ws.close()}if(m.type==='expired')status('Esta sala expirou. Crie uma nova.');};ws.onclose=e=>{clearTimeout(timeout);status('Sinalização encerrada ('+e.code+').');};$('leave').disabled=false;$('cam').disabled=false;$('mic').disabled=false;$('send').disabled=false}function leave(){ws?.close();pc?.close();local?.getTracks().forEach(t=>t.stop());$('local').srcObject=null;$('remote').srcObject=null;$('leave').disabled=true;$('send').disabled=true;status('Você saiu da sala.')}$('join').onclick=start;$('leave').onclick=leave;$('cam').onclick=()=>{camOn=!camOn;local?.getVideoTracks().forEach(t=>t.enabled=camOn);$('cam').textContent=camOn?'Câmera':'Câmera desligada'};$('mic').onclick=()=>{micOn=!micOn;local?.getAudioTracks().forEach(t=>t.enabled=micOn);$('mic').textContent=micOn?'Microfone':'Microfone desligado'};$('send').onclick=()=>{const t=$('msg').value.trim();if(t){send({type:'chat',text:t});chat(t,true);$('msg').value=''}};</script></html>
