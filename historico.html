<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Histórico da entrevista — VagasIO</title><style>body{font-family:Arial;max-width:700px;margin:30px auto;padding:20px}table{width:100%;border-collapse:collapse;margin-top:18px}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}#status{padding:12px;background:#f5f5f5;border-radius:8px}</style><h1>Histórico da entrevista</h1><div id="status">Carregando…</div><table id="tab" style="display:none"><thead><tr><th>Evento</th><th>Participante</th><th>Perfil</th><th>Horário</th></tr></thead><tbody></tbody></table><script>const q=new URLSearchParams(location.search),api='https://vagas-push-teste.onrender.com';const room=q.get('room'),token=q.get('token');function fmt(x){return new Date(x).toLocaleString('pt-BR')}async function load(){if(!room||!token)return status('Link de histórico inválido.');const r=await fetch(api+'/room-events/'+encodeURIComponent(room)+'?token='+encodeURIComponent(token));const j=await r.json();if(!r.ok)return status(j.erro||'Não autorizado');status('Sala: '+room+(j.vaga?' — '+j.vaga:''));const tb=document.querySelector('#tab tbody');j.eventos.forEach(e=>{const tr=document.createElement('tr');[e.tipo,e.nome,e.perfil,fmt(e.horario)].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});tb.appendChild(tr)});document.querySelector('#tab').style.display='table'}function status(t){document.querySelector('#status').textContent=t}load()</script></html>
